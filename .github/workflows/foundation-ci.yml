name: Hub 2.1 Foundation CI

on:
  push:
    branches:
      - hub-2.1
  pull_request:
    branches:
      - hub-2.1
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Ensure npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck Contracts
        run: npm run typecheck:contracts

      - name: Typecheck Domain
        run: npm run typecheck:domain

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Build Web
        run: npm run build:web

      - name: Build API
        run: npm run build:api

      - name: Test Domain
        run: npm run test:domain

      - name: Unit Tests
        run: npm test

  postgres-integration:
    name: PostgreSQL Integration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zafira_hub_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zafira_hub_ci?schema=public
      NODE_ENV: test
      ZAFIRA_TEST_DATABASE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Ensure npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply Migrations
        run: npm run prisma:migrate:deploy

      - name: Status Migrations
        run: npm run prisma:migrate:status

      - name: Prepare CI Organizations
        run: npm run ci:prepare-rbac-organizations

      - name: First RBAC Bootstrap
        run: npm run rbac:bootstrap --workspace=@zafira/api

      - name: Second RBAC Bootstrap (Idempotency)
        run: npm run rbac:bootstrap --workspace=@zafira/api

      - name: Database Integration Tests
        run: npm run test:integration:db

  docker-build:
    name: Docker Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t zafira-hub-api:ci-test \
            .

      - name: Build Web Docker Image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t zafira-hub-web:ci-test \
            .
