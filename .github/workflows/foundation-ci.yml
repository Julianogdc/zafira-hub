          echo "::add-mask::${GATE_PASS_A}"
          echo "::add-mask::${GATE_PASS_B}"
          echo "GATE_PASSWORD_A=${GATE_PASS_A}" >> "$GITHUB_ENV"
          echo "GATE_PASSWORD_B=${GATE_PASS_B}" >> "$GITHUB_ENV"
          echo "Ephemeral Multi-Org Gate Credentials Generated and Masked: PASS"

      - name: Verify Multi-Org Gate Secret Hygiene
        run: |
          python3 - << 'PYEOF'
          import re, sys, pathlib

          lit_patt = r'GATE_PASSWORD_[AB]' + r'\s*=\s*["\x27](?!\$\{)[^"\x27]+["\x27]'
          LITERAL_RE = re.compile(lit_patt)

          legacy_token = ''.join(['Gate', 'Pass', 'Secret'])
          LEGACY_RE = re.compile(re.escape(legacy_token), re.IGNORECASE)

          scan_paths = [
              pathlib.Path('.github/workflows/foundation-ci.yml'),
              *pathlib.Path('scripts/homologation').glob('**/*'),
          ]

          violations = []
          for p in scan_paths:
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue
              for i, line in enumerate(text.splitlines(), 1):
                  if LITERAL_RE.search(line):
                      violations.append(f'{p}:{i} -- hardcoded GATE_PASSWORD detected')
                  if LEGACY_RE.search(line):
                      violations.append(f'{p}:{i} -- legacy forbidden credential pattern detected')

          if violations:
              print('[-] SECRET HYGIENE SCAN FAILED:', file=sys.stderr)
              for v in violations:
                  print(f'  {v}', file=sys.stderr)
              sys.exit(1)

          print('CI_GATE_PASSWORD_LITERAL_SCAN=PASS')
          PYEOF

