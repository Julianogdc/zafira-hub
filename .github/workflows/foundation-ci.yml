name: Hub 2.1 Foundation CI

on:
  push:
    branches:
      - hub-2.1
  pull_request:
    branches:
      - hub-2.1
  workflow_dispatch:

# Permissão mínima padrão para todos os jobs: somente leitura do código.
# Jobs que precisam de mais declaram a própria permissão (publish-images, homologation-rehearsal).
permissions:
  contents: read

jobs:
  quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret Scan (Repository)
        run: bash scripts/ci/secret-scan.sh repo

      - name: Public Guard (informacao operacional)
        run: node scripts/ci/public-guard.mjs repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Ensure npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck Contracts
        run: npm run typecheck:contracts

      # O domínio importa tipos de @zafira/contracts: compilar contracts antes
      - name: Build Contracts
        run: npm run build:contracts

      - name: Typecheck Domain
        run: npm run typecheck:domain

      - name: Build Internal Packages
        run: npm run build:internal

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Typecheck Web
        run: npm run typecheck:web

      # F6-IMP.9 / P13: lint bloqueante do código da F6 (o lint completo do web ainda tem erros legados)
      - name: Lint F6 Web
        run: npm run lint:f6

      # F6-IMP.9 / P13: relatório (não bloqueante) das vulnerabilidades de produção; aviso acima da linha de base (P27)
      - name: Dependency Audit Report (production)
        run: node scripts/ci/npm-audit-report.mjs

      - name: Upload Dependency Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: artifacts/npm-audit/
          retention-days: 14

      - name: Build Web
        run: npm run build:web

      - name: Build API
        run: npm run build:api

      - name: Test Domain
        run: npm run test:domain

      - name: Unit Tests
        run: npm test

      - name: Unit Tests (Web)
        run: npm run test:web

  postgres-integration:
    name: PostgreSQL Integration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/julianogdc/base-postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zafira_hub_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zafira_hub_ci?schema=public
      NODE_ENV: test
      ZAFIRA_TEST_DATABASE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Ensure npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build Internal Packages
        run: npm run build:internal

      - name: Apply Migrations
        run: npm run prisma:migrate:deploy

      - name: Status Migrations
        run: npm run prisma:migrate:status

      - name: Prepare CI Organizations
        run: npm run ci:prepare-rbac-organizations

      - name: First RBAC Bootstrap
        run: npm run rbac:bootstrap --workspace=@zafira/api

      - name: Second RBAC Bootstrap (Idempotency)
        run: npm run rbac:bootstrap --workspace=@zafira/api

      - name: RBAC Pre-deploy Check (HM-1, read-only)
        run: npm run rbac:bootstrap --workspace=@zafira/api -- --check

      - name: Database Integration Tests
        run: npm run test:integration:db

      - name: Database Integration Tests (2nd consecutive run, same database - HM-1/P18)
        run: npm run test:integration:db

  docker-build:
    name: Docker Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t zafira-hub-api:ci-test \
            .

      - name: Build Web Docker Image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t zafira-hub-web:ci-test \
            .

      - name: Bundle Safety Scan
        run: |
          echo "Inspecionando bundle estático gerado dentro da imagem Web..."
          docker create --name web-extract zafira-hub-web:ci-test
          mkdir -p /tmp/web-dist
          docker cp web-extract:/usr/share/nginx/html/. /tmp/web-dist/
          docker rm web-extract

          if grep -rniE "easypanel\.host" /tmp/web-dist; then
            echo "FALHA: Domínio legado hardcoded encontrado no bundle compilado!"
            exit 1
          fi
          echo "Bundle Safety Scan: PASS (zero referências a domínios legados)"

          echo "Varredura de credenciais no bundle público..."
          bash scripts/ci/secret-scan.sh dir /tmp/web-dist

      - name: API Image Secret Files Scan
        run: |
          echo "Verificando se arquivos de ambiente entraram na imagem da API..."
          found=$(docker run --rm --entrypoint sh zafira-hub-api:ci-test -c 'find /app \( -name ".env" -o -name ".env.*" -o -name "*.local" \) -not -name "*.example" -not -path "*/node_modules/*" 2>/dev/null' || true)
          if [ -n "$found" ]; then
            echo "FALHA: arquivos de ambiente encontrados dentro da imagem da API:"
            echo "$found"
            exit 1
          fi
          echo "API Image Secret Files Scan: PASS (nenhum arquivo .env na imagem)"

      - name: Create Smoke Network & Launch API Container
        run: |
          docker network create zafira-hub-smoke
          docker run -d \
            --name api \
            --network zafira-hub-smoke \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e COOKIE_SECRET="smoke-test-dummy-cookie-secret-32-chars-long" \
            -e JWT_SECRET="smoke-test-dummy-jwt-secret-at-least-32-chars" \
            -e HUB_INTERNAL_API_KEY="smoke-test-dummy-internal-api-key-12345" \
            -e BRIGHTBEAN_API_URL="http://brightbean-mock:8000/api/v1" \
            -e DATABASE_URL="postgresql://smoke:smoke@localhost:5432/smoke?schema=public" \
            zafira-hub-api:ci-test

      - name: Verify API Container Smoke & Health
        run: |
          echo "Aguardando container API atingir status healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' api 2>/dev/null || echo "starting")
            echo "Tentativa $i: status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "API container is healthy!"
              break
            fi
            sleep 2
          done

          FINAL_STATUS=$(docker inspect -f '{{.State.Health.Status}}' api)
          if [ "$FINAL_STATUS" != "healthy" ]; then
            echo "FALHA: API container não atingiu status healthy ($FINAL_STATUS)"
            docker logs api
            exit 1
          fi

          echo "Executando requisição direta GET /health na API..."
          docker exec api node -e "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1); return r.json(); }).then(data => { console.log(data); if (data.status !== 'ok') process.exit(1); })"
          echo "API Smoke: PASS"

      - name: Launch Web Container
        run: |
          docker run -d \
            --name web \
            --network zafira-hub-smoke \
            -p 8080:80 \
            -e API_UPSTREAM="http://api:3001" \
            zafira-hub-web:ci-test

      - name: Verify Web Container Smoke & Nginx Render
        run: |
          echo "Aguardando container Web atingir status healthy..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' web 2>/dev/null || echo "starting")
            echo "Tentativa $i: status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Web container is healthy!"
              break
            fi
            sleep 2
          done

          FINAL_STATUS=$(docker inspect -f '{{.State.Health.Status}}' web)
          if [ "$FINAL_STATUS" != "healthy" ]; then
            echo "FALHA: Web container não atingiu status healthy ($FINAL_STATUS)"
            docker logs web
            exit 1
          fi

          echo "Validando configuração Nginx renderizada (nginx -T)..."
          NGINX_CONF=$(docker exec web nginx -T)
          echo "$NGINX_CONF" | grep -q "proxy_pass http://api:3001/;" || {
            echo "FALHA: API_UPSTREAM não foi renderizado corretamente na configuração do Nginx!"
            echo "$NGINX_CONF"
            exit 1
          }

          echo "$NGINX_CONF" | grep -q "try_files \$uri \$uri/ /index.html;" || {
            echo "FALHA: Variável \$uri foi corrompida pelo envsubst!"
            echo "$NGINX_CONF"
            exit 1
          }

          echo "Nginx Template Render: PASS"

      - name: Verify Reverse Proxy Smoke
        run: |
          echo "Testando endpoint raiz do Web (GET /)..."
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          echo "Web Root GET /: PASS"

          echo "Testando reverse proxy Web -> API (GET /hub-api/health)..."
          RESP=$(curl -fsS http://127.0.0.1:8080/hub-api/health)
          echo "Resposta recebida via proxy: $RESP"
          echo "$RESP" | grep -q '"status":"ok"' || echo "$RESP" | grep -q '"status": "ok"' || {
            echo "FALHA: Resposta inesperada de /hub-api/health"
            exit 1
          }
          echo "Reverse Proxy Smoke (/hub-api/health): PASS"

      - name: Cleanup Smoke Containers
        if: always()
        run: |
          echo "Limpando containers e rede de smoke..."
          docker rm -f api web || true
          docker network rm zafira-hub-smoke || true
          echo "Cleanup concluído."

  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [quality, postgres-integration, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/hub-2.1'
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.build-api.outputs.digest }}
      web_digest: ${{ steps.build-web.outputs.digest }}
      api_ref: ghcr.io/julianogdc/zafira-hub-api@${{ steps.build-api.outputs.digest }}
      web_ref: ghcr.io/julianogdc/zafira-hub-web@${{ steps.build-web.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Tags
        id: tags
        run: |
          TAG="git-${{ github.sha }}-run-${{ github.run_id }}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "API Image: ghcr.io/julianogdc/zafira-hub-api:$TAG"
          echo "Web Image: ghcr.io/julianogdc/zafira-hub-web:$TAG"

      - name: Build and Push API Image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/julianogdc/zafira-hub-api:${{ steps.tags.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and Push Web Image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/julianogdc/zafira-hub-web:${{ steps.tags.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate Deployment Manifest
        id: manifest
        run: |
          API_DIGEST="${{ steps.build-api.outputs.digest }}"
          WEB_DIGEST="${{ steps.build-web.outputs.digest }}"
          TAG="${{ steps.tags.outputs.image_tag }}"

          API_IMMUTABLE_REF="ghcr.io/julianogdc/zafira-hub-api@${API_DIGEST}"
          WEB_IMMUTABLE_REF="ghcr.io/julianogdc/zafira-hub-web@${WEB_DIGEST}"

          cat <<EOF > deployment-manifest.json
          {
            "gitSha": "${{ github.sha }}",
            "workflowRunId": "${{ github.run_id }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "api": {
              "image": "ghcr.io/julianogdc/zafira-hub-api",
              "tag": "${TAG}",
              "digest": "${API_DIGEST}",
              "immutableRef": "${API_IMMUTABLE_REF}"
            },
            "web": {
              "image": "ghcr.io/julianogdc/zafira-hub-web",
              "tag": "${TAG}",
              "digest": "${WEB_DIGEST}",
              "immutableRef": "${WEB_IMMUTABLE_REF}"
            }
          }
          EOF

          echo "Deployment Manifest Gerado:"
          cat deployment-manifest.json

          echo "### 🚀 Zafira Hub 2.1 — Immutable Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Git Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow Run:** \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Tag | Immutable Reference |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **API** | \`${TAG}\` | \`${API_IMMUTABLE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Web** | \`${TAG}\` | \`${WEB_IMMUTABLE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Deployment Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zafira-hub-deployment-manifest-${{ github.sha }}
          path: deployment-manifest.json
          retention-days: 90

      - name: Verify Published Images via Digest Pull & Smoke Test
        run: |
          API_DIGEST="${{ steps.build-api.outputs.digest }}"
          WEB_DIGEST="${{ steps.build-web.outputs.digest }}"
          API_REF="ghcr.io/julianogdc/zafira-hub-api@${API_DIGEST}"
          WEB_REF="ghcr.io/julianogdc/zafira-hub-web@${WEB_DIGEST}"

          echo "1. Efetuando pull das imagens publicadas por digest sha256..."
          docker pull "${API_REF}"
          docker pull "${WEB_REF}"

          echo "2. Validando OCI revision das imagens publicadas..."
          API_REV=$(docker inspect "${API_REF}" | grep '"org.opencontainers.image.revision"' | head -n 1)
          WEB_REV=$(docker inspect "${WEB_REF}" | grep '"org.opencontainers.image.revision"' | head -n 1)
          echo "API OCI Revision: $API_REV"
          echo "Web OCI Revision: $WEB_REV"

          echo "$API_REV" | grep -q "${{ github.sha }}" || {
            echo "FALHA: Revision da API não corresponde ao Git SHA!"
            exit 1
          }
          echo "$WEB_REV" | grep -q "${{ github.sha }}" || {
            echo "FALHA: Revision do Web não corresponde ao Git SHA!"
            exit 1
          }

          echo "3. Criando rede temporária de smoke para imagens publicadas..."
          docker network create zafira-hub-registry-smoke

          echo "4. Iniciando container API a partir do digest publicado..."
          docker run -d \
            --name api-published \
            --network zafira-hub-registry-smoke \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e COOKIE_SECRET="smoke-test-dummy-cookie-secret-32-chars-long" \
            -e JWT_SECRET="smoke-test-dummy-jwt-secret-at-least-32-chars" \
            -e HUB_INTERNAL_API_KEY="smoke-test-dummy-internal-api-key-12345" \
            -e BRIGHTBEAN_API_URL="http://brightbean-mock:8000/api/v1" \
            -e DATABASE_URL="postgresql://smoke:smoke@localhost:5432/smoke?schema=public" \
            "${API_REF}"

          echo "5. Aguardando container API publicado atingir status healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' api-published 2>/dev/null || echo "starting")
            echo "Tentativa $i: status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "API container publicado is healthy!"
              break
            fi
            sleep 2
          done

          API_STATUS=$(docker inspect -f '{{.State.Health.Status}}' api-published)
          if [ "$API_STATUS" != "healthy" ]; then
            echo "FALHA: Container API publicado não atingiu status healthy ($API_STATUS)"
            docker logs api-published
            exit 1
          fi

          echo "6. Testando endpoint GET /health na API publicada..."
          docker exec api-published node -e "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1); return r.json(); }).then(data => { console.log(data); if (data.status !== 'ok') process.exit(1); })"
          echo "API Published GET /health: PASS"

          echo "7. Iniciando container Web a partir do digest publicado..."
          docker run -d \
            --name web-published \
            --network zafira-hub-registry-smoke \
            -p 8081:80 \
            -e API_UPSTREAM="http://api-published:3001" \
            "${WEB_REF}"

          echo "8. Aguardando container Web publicado atingir status healthy..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' web-published 2>/dev/null || echo "starting")
            echo "Tentativa $i: status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Web container publicado is healthy!"
              break
            fi
            sleep 2
          done

          WEB_STATUS=$(docker inspect -f '{{.State.Health.Status}}' web-published)
          if [ "$WEB_STATUS" != "healthy" ]; then
            echo "FALHA: Container Web publicado não atingiu status healthy ($WEB_STATUS)"
            docker logs web-published
            exit 1
          fi

          echo "9. Testando endpoint raiz do Web publicado (GET /)..."
          curl -fsS http://127.0.0.1:8081/ > /dev/null
          echo "Web Published Root GET /: PASS"

          echo "10. Testando reverse proxy Web -> API via imagens publicadas (GET /hub-api/health)..."
          PUB_RESP=$(curl -fsS http://127.0.0.1:8081/hub-api/health)
          echo "Resposta recebida da imagem publicada via proxy: $PUB_RESP"
          echo "$PUB_RESP" | grep -q '"status":"ok"' || echo "$PUB_RESP" | grep -q '"status": "ok"' || {
            echo "FALHA: Resposta inesperada de /hub-api/health da imagem publicada!"
            exit 1
          }
          echo "Reverse Proxy Published Smoke (/hub-api/health): PASS"

      - name: Cleanup Registry Smoke Containers
        if: always()
        run: |
          echo "Limpando containers e rede de smoke de registry..."
          docker rm -f api-published web-published || true
          docker network rm zafira-hub-registry-smoke || true
          echo "Cleanup de registry smoke concluído."

  homologation-rehearsal:
    name: Homologation Rehearsal
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/hub-2.1'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Published Image References
        run: |
          API_REF="${{ needs.publish-images.outputs.api_ref }}"
          WEB_REF="${{ needs.publish-images.outputs.web_ref }}"
          echo "API Published Ref: $API_REF"
          echo "Web Published Ref: $WEB_REF"

          export API_IMAGE_REF="$API_REF"
          export WEB_IMAGE_REF="$WEB_REF"
          bash scripts/homologation/validate-immutable-images.sh

      - name: Setup CI Staging Network and PostgreSQL
        run: |
          echo "Criando rede Docker dedicada para homologação CI..."
          docker network create zafira-hub-hml-ci

          echo "Baixando imagem do PostgreSQL (com novas tentativas se o registro limitar requisições)..."
          for i in 1 2 3 4 5; do
            docker pull ghcr.io/julianogdc/base-postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d && break
            if [ "$i" = "5" ]; then
              echo "FALHA: não foi possível baixar ghcr.io/julianogdc/base-postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d após 5 tentativas"
              exit 1
            fi
            echo "Tentativa $i falhou; aguardando $((i * 20))s..."
            sleep $((i * 20))
          done

          echo "Iniciando container PostgreSQL dedicado para homologação (zafira_hub_21_staging)..."
          docker run -d \
            --name postgres-hml \
            --network zafira-hub-hml-ci \
            -e POSTGRES_USER=postgres_hml \
            -e POSTGRES_PASSWORD=hml_staging_dummy_pass_123 \
            -e POSTGRES_DB=zafira_hub_21_staging \
            ghcr.io/julianogdc/base-postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d

          # P40 (DEC-F8-032): a imagem oficial sobe primeiro um servidor PROVISORIO so por socket Unix (para criar a base)
          # e o desliga antes do definitivo. pg_isready pelo socket responde nessa fase e a checagem final caia no
          # desligamento. Aqui a prontidao e conferida por TCP (o provisorio nao atende), com espera limitada e
          # consulta efetiva na base definitiva, e so vale com tres respostas seguidas (servidor estavel).
          echo "Aguardando PostgreSQL definitivo ficar pronto (TCP + consulta na base)..."
          READY=0
          OK_STREAK=0
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f "{{.State.Running}}" postgres-hml 2>/dev/null)" != "true" ]; then
              echo "FALHA: container postgres-hml não está em execução"
              docker logs postgres-hml || true
              exit 1
            fi
            DB_NAME=$(docker exec -e PGPASSWORD=hml_staging_dummy_pass_123 postgres-hml \
              psql -h 127.0.0.1 -p 5432 -U postgres_hml -d zafira_hub_21_staging -t -A -c "SELECT current_database()" 2>/dev/null || true)
            if [ "$DB_NAME" = "zafira_hub_21_staging" ]; then
              OK_STREAK=$((OK_STREAK + 1))
            else
              OK_STREAK=0
            fi
            if [ "$OK_STREAK" -ge 3 ]; then
              READY=1
              echo "PostgreSQL Staging está pronto (TCP, base ${DB_NAME}, $OK_STREAK respostas seguidas)!"
              break
            fi
            echo "Aguardando PostgreSQL... ($i/90)"
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "FALHA: PostgreSQL staging não respondeu por TCP com a base definitiva em 90 s"
            docker logs postgres-hml
            exit 1
          fi

      - name: Validate Database Target Safety
        run: |
          DATABASE_URL="postgresql://postgres_hml:hml_staging_dummy_pass_123@postgres-hml:5432/zafira_hub_21_staging?schema=public"
          export DATABASE_URL
          bash scripts/homologation/validate-database-target.sh

      - name: Run Staging Migrations using Published API Image
        run: |
          API_REF="${{ needs.publish-images.outputs.api_ref }}"
