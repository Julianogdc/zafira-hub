# NOTA DE AUDITORIA (HM-3): A imagem Docker Web (apps/web/Dockerfile) utiliza
# apps/web/nginx.conf.template processado por envsubst em runtime.
# Este arquivo e mantido sincronizado para desenvolvimento local e referencia.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # Limite multipart para arquivos de ate 100 MiB com margem para overhead do formulario (110m)
    client_max_body_size 110m;
    client_body_timeout 120s;

    # Reverse proxy para API do Hub 2.1
    location /hub-api/ {
        proxy_pass http://api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        # SPA fallback (Vite / React)
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
